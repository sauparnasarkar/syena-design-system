name: CI

on:
  pull_request:
  push:
    branches: [main]

# The checks only read the repository: the token they run with gets no write access to anything.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit (the one the v4 tag pointed at on 2026-10-23), so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tokens, with contrast and colour-vision validation
        run: npm run tokens
      - name: Generated documentation is committed
        run: git diff --exit-code FOUNDATIONS.md tokens
      - run: npm run lint
      - run: npm run typecheck
      - name: Allowlist checks on source
        run: npm run check:allowlist
      - name: Build Storybook
        run: npm run build-storybook
      - name: Allowlist checks on build output
        run: node scripts/check-allowlist.mjs --build storybook-static/assets
      - name: Stories (interaction and axe) and unit tests
        run: npx vitest run
      - name: Layout checks with floating scrollbars
        run: npm run test:overlay
      - name: Visual comparison
        if: ${{ hashFiles('tests/visual/__screenshots__/**') != '' }}
        run: npm run test:visual
